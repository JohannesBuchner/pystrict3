[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
name = "pystrict3"
version = "1.0.1"
description = "Static code analyser for Python3 function calls, string interpolation and variable shadowing"
readme = "README.rst"
authors = [
    { name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com" }
]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "redbaron",
    "setuptools",
]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/pystrict3"
Source = "https://github.com/JohannesBuchner/pystrict3"
Documentation = "https://github.com/JohannesBuchner/pystrict3"

[project.scripts]
pystrict3 = "pystrict3:main"
gendocstr = "gendocstr:main"

[tool.setuptools.packages.find]
include = ["pystrict3lib"]

[tool.pytest.ini_options]
collect_ignore = ["setup.py"]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "setup.py"
search = "version='{current_version}'"
replace = "version='{new_version}'"
