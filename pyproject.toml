[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystrict3"
version = "1.0.2"
description = "Static code analyser for Python3 function calls, string interpolation and variable shadowing"
readme = "README.rst"
authors = [
    { name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com" }
]
license = "MIT"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "redbaron",
    "setuptools",
]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/pystrict3"
Source = "https://github.com/JohannesBuchner/pystrict3"
Documentation = "https://github.com/JohannesBuchner/pystrict3"

[project.scripts]
pystrict3 = "pystrict3:run"
gendocstr = "gendocstr:main"

[tool.setuptools]
# pystrict3.py is a top-level module (not a package) and must be listed here
# so it is installed and importable, making the `pystrict3` entry point work.
py-modules = ["pystrict3", "gendocstr"]

[tool.setuptools.packages.find]
include = ["pystrict3lib*"]

[tool.bumpversion]
current_version = "1.0.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
